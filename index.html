<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FUT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUT">
<meta name="theme-color" content="#050508">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html { -webkit-text-size-adjust: 100%; height: 100%; touch-action: pan-x pan-y; }
body, button, a, label, input, select, textarea { touch-action: manipulation; }
html, body, * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img, svg { -webkit-user-drag: none; }
[hidden] { display: none !important; }
:root {
  --base: #eef0f6;
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.84); --glass-sheen: rgba(255,255,255,.55);
  --glass-edge: rgba(255,255,255,.75); --glass-hi: rgba(255,255,255,.9);
  --glass-shadow: 0 10px 30px rgba(30,40,80,.08), 0 1px 2px rgba(30,40,80,.06);
  --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.2);
  --fg: #0b0b0f; --fg2: rgba(40,40,52,.64); --fg3: rgba(40,40,52,.36); --sep: rgba(60,60,67,.14);
  --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; --yellow: #ffcc00;
  --gold1: #f6e27a; --gold2: #c9a227; --goldfg: #3b2a00;
  --blob1: rgba(52,199,120,.38); --blob2: rgba(64,140,255,.38); --blob3: rgba(255,190,60,.28);
  --scrim: rgba(10,12,20,.28);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --spring: cubic-bezier(.32,.72,0,1);
}
:root[data-theme="dark"] {
  --base: #050508; --glass: rgba(44,44,52,.46); --glass-strong: rgba(30,30,36,.9); --glass-sheen: rgba(255,255,255,.08);
  --glass-edge: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.16); --glass-shadow: 0 10px 30px rgba(0,0,0,.35);
  --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.36); --fg: #fff; --fg2: rgba(235,235,245,.62); --fg3: rgba(235,235,245,.32); --sep: rgba(255,255,255,.1);
  --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --purple: #bf5af2; --teal: #40c8e0; --yellow: #ffd60a;
  --blob1: rgba(40,200,120,.26); --blob2: rgba(40,110,255,.3); --blob3: rgba(255,170,40,.16); --scrim: rgba(0,0,0,.5); color-scheme: dark;
}
html, body { background: var(--base); color: var(--fg); }
body { margin: 0; min-height: 100%; overscroll-behavior-y: none; font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.press { transition: transform 160ms cubic-bezier(.3,.7,.4,1.4), opacity 120ms ease-out; }
.press:active { transform: scale(.96); }
.num { font-variant-numeric: tabular-nums; }

.ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: var(--blob1); }
.ambient i:nth-child(2) { width: 65vmax; height: 65vmax; right: -30vmax; top: 15vh; background: var(--blob2); }
.ambient i:nth-child(3) { width: 60vmax; height: 60vmax; left: -10vmax; bottom: -35vmax; background: var(--blob3); }

.glass, .card, .list, .tabbar, .sheet, .seg, .toast, .search, .fab {
  background: linear-gradient(160deg, var(--glass-sheen), transparent 42%), var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%); backdrop-filter: blur(26px) saturate(185%);
  border: .5px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow);
}
@media (prefers-reduced-transparency: reduce) { .glass, .card, .list, .tabbar, .sheet, .seg, .toast, .search, .fab { background: var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; } }

/* Layout */
#app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 110px); }
.page { display: none; animation: pagein 280ms var(--spring); }
.page.on { display: block; }
@keyframes pagein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 14px 2px 14px; }
.top h1 { font: 700 34px/1.08 var(--font); letter-spacing: -.022em; margin: 0; }
.top .sub { color: var(--fg2); font-size: 15px; margin-top: 2px; }
.topbtns { display: flex; gap: 8px; }
.ibtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--blue); }
.ibtn svg { width: 22px; height: 22px; }
h2.sec { font: 600 13px/1 var(--font); text-transform: uppercase; letter-spacing: .02em; color: var(--fg2); margin: 22px 16px 8px; display: flex; justify-content: space-between; align-items: center; }
h2.sec button { color: var(--blue); text-transform: none; font-size: 15px; letter-spacing: 0; font-weight: 400; }
.card { border-radius: 24px; padding: 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font: 600 15px/1.2 var(--font); color: var(--fg2); display: flex; align-items: center; gap: 6px; }
.big { font: 700 34px/1.05 var(--round); letter-spacing: -.02em; }
.mid { font: 600 22px/1.1 var(--round); }
.muted { color: var(--fg2); }
.faint { color: var(--fg3); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > .card { margin: 0; }
.mb { margin-bottom: 12px; }

/* Lists */
.list { border-radius: 22px; overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 52px; position: relative; width: 100%; text-align: left; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.li.ind + .li.ind::before { left: 64px; }
button.li:active, .li.tap:active { background: var(--fill); }
.li .main { flex: 1; min-width: 0; }
.li .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .s { font-size: 13px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .r { color: var(--fg2); font-size: 15px; text-align: right; white-space: nowrap; }
.chev { width: 8px; height: 13px; color: var(--fg3); flex: none; }
.empty { text-align: center; padding: 28px 16px; color: var(--fg2); }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

/* Rating badge */
.ovr { width: 40px; height: 44px; flex: none; border-radius: 10px 10px 14px 14px; display: grid; place-items: center; font: 800 18px/1 var(--round); color: var(--goldfg);
  background: linear-gradient(160deg, var(--gold1), var(--gold2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 6px rgba(150,110,0,.25); position: relative; }
.ovr small { position: absolute; bottom: 3px; font-size: 8px; font-weight: 700; letter-spacing: .02em; opacity: .75; }
.ovr.lo { --gold1: #e7e9ee; --gold2: #a9aeb8; --goldfg: #24262c; }
.ovr.hi { --gold1: #9fe7ff; --gold2: #3a7bd5; --goldfg: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 8px rgba(40,100,220,.35); }
.lock { width: 15px; height: 15px; color: var(--orange); flex: none; }

/* Chips & segmented */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--fg); color: var(--base); }
.chipwrap { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; padding: 3px; border-radius: 14px; margin-bottom: 14px; position: relative; }
.seg button { flex: 1; height: 34px; border-radius: 11px; font-size: 15px; font-weight: 500; color: var(--fg2); position: relative; z-index: 1; transition: color 200ms; }
.seg button.on { color: var(--fg); background: var(--glass-strong); box-shadow: 0 2px 8px rgba(0,0,0,.08), inset 0 .5px 0 var(--glass-hi); }
.search { display: flex; align-items: center; gap: 8px; height: 42px; border-radius: 21px; padding: 0 14px; margin-bottom: 10px; }
.search svg { width: 17px; height: 17px; color: var(--fg2); flex: none; }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; min-width: 0; }

/* Buttons */
.btn { height: 50px; border-radius: 25px; padding: 0 20px; font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--fill); }
.btn.pri { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(0,122,255,.3), inset 0 1px 0 rgba(255,255,255,.3); }
.btn.green { background: var(--green); color: #fff; }
.btn.red { background: var(--red); color: #fff; }
.btn.full { width: 100%; }
.btn.sm { height: 36px; border-radius: 18px; padding: 0 14px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; }
.btnrow { display: flex; gap: 10px; }
.btnrow > * { flex: 1; }
.link { color: var(--blue); }

/* Fields */
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 50px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.field label { flex: none; min-width: 96px; }
.field input, .field select, .field textarea { flex: 1; min-width: 0; border: 0; background: none; outline: none; text-align: right; font-size: 17px; padding: 12px 0; }
.field select { -webkit-appearance: none; appearance: none; color: var(--blue); direction: rtl; }
.field textarea { text-align: left; resize: none; min-height: 80px; }
.field.col { flex-direction: column; align-items: stretch; padding-top: 12px; padding-bottom: 12px; gap: 8px; }
.field.col label { min-width: 0; }
textarea.paste { width: 100%; min-height: 160px; border-radius: 16px; border: 0; background: var(--fill); padding: 12px; outline: none; resize: vertical; font-size: 14px; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); position: relative; flex: none; transition: background 220ms; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.1); transition: transform 260ms var(--spring); }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 36px; border-radius: 12px; background: var(--fill); font-size: 22px; font-weight: 500; display: grid; place-items: center; }
.stepper b { min-width: 44px; text-align: center; font: 700 26px/1 var(--round); }

/* Score input */
.score { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0 4px; }
.score .side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.score .side span { font-size: 13px; color: var(--fg2); }
.score .colon { font: 700 40px/1 var(--round); color: var(--fg3); }
.score .val { font: 800 56px/1 var(--round); min-width: 60px; text-align: center; }
.score .pm { display: flex; gap: 8px; }
.score .pm button { width: 44px; height: 38px; border-radius: 12px; background: var(--fill); font-size: 22px; }

/* Tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 12px); display: flex; gap: 2px; padding: 5px; border-radius: 32px; z-index: 30; max-width: calc(100% - 24px); }
.tabbar button { width: 70px; height: 54px; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--fg2); transition: color 200ms, background 260ms var(--spring); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--blue); background: var(--fill); }
@media (max-width: 380px) { .tabbar button { width: 62px; } }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity 300ms; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; z-index: 41; border-radius: 28px 28px 0 0; max-height: calc(100% - env(safe-area-inset-top) - 12px); display: flex; flex-direction: column;
  background: var(--glass-strong); transform: translateY(105%); transition: transform 440ms var(--spring); will-change: transform; }
.sheet.on { transform: translateY(0); }
.sheet .grab { height: 22px; flex: none; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); }
.sheet .sh { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 8px; flex: none; touch-action: none; }
.sheet .sh h2 { font: 700 20px/1.2 var(--font); margin: 0; letter-spacing: -.01em; flex: 1; text-align: center; }
.sheet .sh button { min-width: 64px; height: 36px; color: var(--blue); font-size: 17px; }
.sheet .sh button.done { font-weight: 600; text-align: right; }
.sheet .sh button:first-child { text-align: left; }
.sheet .sb { overflow-y: auto; padding: 4px 16px calc(env(safe-area-inset-bottom) + 20px); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet .list, .sheet .card { background: var(--fill); box-shadow: none; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: opacity 200ms; transform: none; opacity: 0; } .sheet.on { opacity: 1; } .page { animation: none; } }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); transform: translate(-50%, -140%); z-index: 60; padding: 12px 18px; border-radius: 22px; font-weight: 600; font-size: 15px; transition: transform 420ms var(--spring); background: var(--glass-strong); max-width: calc(100% - 32px); }
.toast.on { transform: translate(-50%, 0); }

/* Ring */
.ring { position: relative; width: 112px; height: 112px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.ring .bg { stroke: var(--fill-2); }
.ring .fg { stroke: var(--green); transition: stroke-dashoffset 700ms var(--spring); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .lbl b { font: 800 30px/1 var(--round); display: block; }
.ring .lbl span { font-size: 12px; color: var(--fg2); }

/* Results */
.res { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 800 14px/1 var(--round); color: #fff; flex: none; }
.res.W { background: var(--green); } .res.L { background: var(--red); } .res.D { background: var(--fg3); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 14px; height: 14px; border-radius: 5px; background: var(--fill-2); }
.dots i.W { background: var(--green); } .dots i.L { background: var(--red); } .dots i.D { background: var(--fg3); }
.bar { height: 8px; border-radius: 4px; background: var(--fill-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }
.pos { color: var(--green); } .neg { color: var(--red); }
.tilt { background: linear-gradient(160deg, rgba(255,59,48,.22), rgba(255,149,0,.12)), var(--glass); }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; background: var(--fill); color: var(--fg2); }
.badge.g { background: rgba(52,199,89,.16); color: var(--green); }
.badge.o { background: rgba(255,149,0,.16); color: var(--orange); }
.badge.r { background: rgba(255,59,48,.14); color: var(--red); }
.badge.b { background: rgba(0,122,255,.14); color: var(--blue); }

/* Pitch */
.pitch { position: relative; aspect-ratio: 3/4; border-radius: 24px; overflow: hidden; margin-bottom: 12px;
  background: repeating-linear-gradient(180deg, rgba(52,199,89,.18) 0 12.5%, rgba(52,199,89,.1) 12.5% 25%), var(--glass);
  border: .5px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow); }
.pitch .lines { position: absolute; inset: 14px; border: 1.5px solid rgba(255,255,255,.35); border-radius: 8px; }
.pitch .lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid rgba(255,255,255,.35); }
.pitch .lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%,-50%); border: 1.5px solid rgba(255,255,255,.35); border-radius: 50%; }
.pp { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 70px; }
.pp .ovr { width: 38px; height: 42px; font-size: 17px; }
.pp span { font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; padding: 1px 6px; border-radius: 8px; background: var(--glass-strong); }

/* Player sheet */
.pcard { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.pcard .ovr { width: 72px; height: 80px; font-size: 34px; border-radius: 16px 16px 24px 24px; }
.pcard .ovr small { font-size: 12px; bottom: 6px; }
.pcard h3 { margin: 0; font: 700 24px/1.15 var(--font); letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.stat .spread { font-size: 14px; margin-bottom: 4px; }
.stat b { font: 700 15px/1 var(--round); }

/* Chart */
.chart { width: 100%; height: 120px; display: block; }
.chart path.l { fill: none; stroke: var(--blue); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart path.a { fill: url(#cg); }
.hbars .hb { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; font-size: 14px; margin: 8px 0; }
.hbars .hb span:last-child { text-align: right; color: var(--fg2); }

.slot { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.slot button { height: 58px; border-radius: 14px; background: var(--fill); font: 700 20px/1 var(--round); position: relative; }
.slot button.fix { background: var(--blue); color: #fff; }
.slot button.sel { outline: 2px solid var(--blue); outline-offset: 1px; }
.slot button small { position: absolute; top: 4px; left: 0; right: 0; font-size: 9px; font-weight: 600; opacity: .7; }
.result { text-align: center; padding: 6px 0 2px; }
.result .big { font-size: 56px; }
.ok { color: var(--green); } .no { color: var(--red); }
.kbd { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.kbd button { height: 44px; border-radius: 12px; background: var(--fill); font: 600 18px/1 var(--round); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.dl dt { color: var(--fg2); } .dl dd { margin: 0; text-align: right; font-weight: 500; }
.help { font-size: 14px; color: var(--fg2); margin: 6px 4px 12px; line-height: 1.45; }
.help ol { padding-left: 20px; margin: 6px 0; } .help li { margin: 3px 0; }
.wedit { display: flex; align-items: center; gap: 6px; }
.wedit button { width: 34px; height: 34px; border-radius: 10px; background: var(--fill); display: grid; place-items: center; }
.wedit button svg { width: 16px; height: 16px; }
.pause { font: 800 44px/1 var(--round); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-club"></section>
  <section class="page" id="p-match"></section>
  <section class="page" id="p-coins"></section>
  <section class="page" id="p-more"></section>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="sheets"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filein" accept=".json,application/json" hidden>

<script>
'use strict';
const VERSION = '1.0.0';
const KEY = 'fut.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('sv-SE');

/* ---------- Sheets (drag to dismiss with velocity) ---------- */
const sheetStack = [];
function openSheet({ title, body, done, cancel = 'Stäng', onDone, mount, onClose }) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="grab"></div><div class="sh"><button data-x>${esc(cancel)}</button><h2>${esc(title)}</h2>${done ? `<button class="done" data-ok>${esc(done)}</button>` : '<button aria-hidden="true" tabindex="-1"></button>'}</div><div class="sb">${body}</div>`;
  $('#sheets').append(scrim, el);
  const h = { el, scrim, close, onClose };
  sheetStack.push(h);
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('on'); el.classList.add('on'); }));
  function close() {
    if (h.closed) return; h.closed = true;
    el.style.transition = ''; el.style.transform = '';
    el.classList.remove('on'); scrim.classList.remove('on');
    const i = sheetStack.indexOf(h); if (i >= 0) sheetStack.splice(i, 1);
    setTimeout(() => { el.remove(); scrim.remove(); }, 450);
    onClose?.();
  }
  scrim.onclick = close;
  el.querySelector('[data-x]').onclick = close;
  const ok = el.querySelector('[data-ok]');
  if (ok) ok.onclick = () => { if (onDone?.(el) !== false) close(); };
  // drag to dismiss
  let y0 = 0, dy = 0, hist = [], drag = false;
  const zones = [el.querySelector('.grab'), el.querySelector('.sh')];
  zones.forEach(z => z.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    drag = true; y0 = e.clientY; dy = 0; hist = [[e.timeStamp, 0]]; z.setPointerCapture(e.pointerId); el.style.transition = 'none';
  }));
  zones.forEach(z => z.addEventListener('pointermove', e => {
    if (!drag) return; dy = e.clientY - y0;
    const v = dy < 0 ? -(Math.abs(dy) * 30) / (30 + Math.abs(dy)) : dy; // rubber band upward
    el.style.transform = `translateY(${v}px)`; hist.push([e.timeStamp, dy]); if (hist.length > 6) hist.shift();
  }));
  const end = () => {
    if (!drag) return; drag = false;
    const [t1, d1] = hist[0], [t2, d2] = hist[hist.length - 1];
    const vel = t2 > t1 ? (d2 - d1) / (t2 - t1) * 1000 : 0;
    const projected = dy + (vel / 1000) * 0.998 / (1 - 0.998);
    el.style.transition = '';
    if (projected > el.offsetHeight * 0.45 || vel > 900) close(); else el.style.transform = '';
  };
  zones.forEach(z => { z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end); });
  mount?.(el, h);
  return h;
}
function confirmSheet(title, text, label, fn, danger = true) {

/* ---------- Ratings ---------- */
function squadRating(rs) {
  const n = rs.length; if (!n) return { rating: 0, exact: 0 };
  const sum = rs.reduce((a, b) => a + b, 0), avg = sum / n;
  const excess = rs.reduce((a, r) => a + Math.max(0, r - avg), 0);
  const total = Math.round(sum + excess);
  return { rating: Math.floor(total / n), exact: total / n };
}

function curRun() { return S.runs[S.runs.length - 1]; }

function rankFor(w) { const r = S.settings.ranks.find(([n]) => w >= n); return r ? r[1] : 'Ingen rank än'; }
function nextRank(w) { const rs = [...S.settings.ranks].sort((a, b) => a[0] - b[0]); return rs.find(([n]) => n > w); }
function wld(ms) { const o = { W: 0, D: 0, L: 0 }; ms.forEach(m => o[m.res]++); return o; }
function lossStreak() { const ms = [...S.matches].sort((a, b) => b.t - a.t); let n = 0; for (const m of ms) { if (m.res === 'L') n++; else break; } return n; }

function sparkline(vals) {

/* ---------- Import from FUT.GG ---------- */
function parseFutgg(text) {
  text = text.trim();
  if (text.startsWith('{')) { const j = JSON.parse(text); return { players: ensureIds(j.players || j.club?.players || []), squad: j.squad || null, name: j.club?.name || j.club || '' }; }
  const T = text.replace(/ /g, ' ').split(/\s+/).filter(Boolean);
  const STATK = new Set(['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY', 'DIV', 'HAN', 'KIC', 'REF', 'SPD', 'POS']);
  const HEAD = new Set(['Menu', 'Filters', 'Players', 'Squads', 'Tactics', 'Statistics', 'Previous', 'Next', 'Home', 'NEW', 'Collapse', 'BENCH', 'Share', 'Copy']);
  const isNum = s => /^\d{1,2}$/.test(s);
  const out = []; let start = 0, squad = null;
  for (let i = 0; i < T.length - 1; i++) {
    if (T[i] === 'Previous') break;
    if (!(isNum(T[i]) && +T[i] >= 40 && POSSET.has(T[i + 1]))) continue;
    let nameT = T.slice(start, i);
    let cut = -1; nameT.forEach((t, k) => { if (HEAD.has(t) || /^[\d.,]+[KM]?$/.test(t) || t === '++' || POSSET.has(t)) cut = k; });
    nameT = nameT.slice(cut + 1);
    if (nameT.length > 4) nameT = nameT.slice(-3);
    if (!nameT.length) continue;
    const p = { name: nameT.join(' '), ovr: +T[i], pos: T[i + 1], alt: [], stats: {} };
    let j = i + 2;
    while (j + 1 < T.length && STATK.has(T[j]) && /^\d+$/.test(T[j + 1])) { p.stats[T[j].toLowerCase()] = +T[j + 1]; j += 2; }
    while (j < T.length && POSSET.has(T[j])) { p.alt.push(T[j]); j++; }
    if (T[j] === 'L' || T[j] === 'R') { p.foot = T[j]; p.skills = +T[j + 1] || 0; if (T[j + 2] === '★') { p.weakFoot = +T[j + 3] || 0; j += 4; } else j += 2; }
    if (isNum(T[j]) && POSSET.has(T[j + 1])) { p.evoLevel = +T[j]; j++; }
    if (POSSET.has(T[j]) && /^\d+\.\d$/.test(T[j + 1] || '')) { p.bestPos = T[j]; p.ggr = +T[j + 1]; j += 2; }
    if (/^\d+(\.\d+)?[KM]?$/.test(T[j] || '') && !(isNum(T[j]) && POSSET.has(T[j + 2]))) { const s = T[j].toUpperCase(); p.price = Math.round(parseFloat(s) * (s.endsWith('M') ? 1e6 : s.endsWith('K') ? 1e3 : 1)); j++; }
    if (T[j] === 'LEVEL' && isNum(T[j + 1])) { p.evoLevel = +T[j + 1]; j += 2; }
    p.tradeable = !!p.price;
    out.push(p); start = j; i = j - 1;
  }
  // squad page detection: "4-1-2-1-2 (2)" + "BENCH"
  if (T.includes('BENCH') && out.length >= 11) {
    const bi = text.split(/\s+/).indexOf('BENCH');
    const fm = text.match(/\b(\d-\d-\d(?:-\d)?(?:-\d)?(?: \(\d\))?)\b/);
    const xi = out.slice(0, 11).map(p => [p.pos, p.name]);
    squad = { name: (text.match(/\n([A-ZÅÄÖ0-9]{2,})\nCreated by/) || [])[1] || 'Mitt lag', formation: fm ? fm[1] : '', xi, bench: out.slice(11).map(p => p.name) };
  }
  return { players: out, squad };
}

      save(); toast('Klubben är sparad'); render();
    }
  });

        const t = e.target.closest('button'); if (!t) return;
        if (t.dataset.t) { target = Math.max(60, Math.min(99, target + +t.dataset.t)); S.settings.lastTarget = target; save(); re(); }
        else if (t.dataset.s != null) { sel = sel === +t.dataset.s ? -1 : +t.dataset.s; re(); }
        else if (t.dataset.k) { if (t.dataset.k === 'x') slots[sel] = null; else slots[sel] = +t.dataset.k; if (pick) pick[sel] = null; sel = -1; re(); }
        else if (t.hasAttribute('data-clear')) { slots = Array(11).fill(null); pick = null; sel = -1; re(); }
        else if (t.hasAttribute('data-fill')) {
          const fixedIdx = slots.map((v, i) => v != null && !pick?.[i] ? i : -1).filter(i => i >= 0);
          const fixed = fixedIdx.map(i => slots[i]);
          const res = solveSBC(target, fixed, 11 - fixed.length);
          if (!res) { toast('Hittar ingen kombination med ditt foder'); return; }
          pick = Array(11).fill(null); let k = 0;
          slots = slots.map((v, i) => fixedIdx.includes(i) ? v : null);
          for (let i = 0; i < 11; i++) if (!fixedIdx.includes(i)) { const p = res[k++]; slots[i] = p.ovr; pick[i] = p; }
          sel = -1; re(); toast('Förslag klart');
        } else if (t.hasAttribute('data-copy')) {
          const txt = pick.filter(Boolean).map(p => `${p.ovr} ${p.name}`).join('\n');
          navigator.clipboard?.writeText(txt).then(() => toast('Kopierat'), () => toast('Kunde inte kopiera'));
        }
      });
    }
  });
}
function solveSBC(target, fixed, open) {
  if (open <= 0) return [];
  const avail = players().filter(p => !isLocked(p));
  const cost = p => p.tradeable ? (p.price || fodderVal(p.ovr)) : fodderVal(p.ovr) * 0.6;
  const byR = {};
  avail.forEach(p => (byR[p.ovr] = byR[p.ovr] || []).push(p));
  Object.values(byR).forEach(a => a.sort((x, y) => cost(x) - cost(y)));
  const levels = Object.keys(byR).map(Number).filter(r => r >= target - 6 && r <= target + 4).sort((a, b) => b - a);
  if (!levels.length) return null;
  const pre = {}; levels.forEach(r => { pre[r] = [0]; byR[r].forEach((p, i) => pre[r].push(pre[r][i] + cost(p))); });
  let best = null, bestCost = Infinity;
  const cnt = {};
  const rec = (li, left, cur, acc) => {
    if (acc >= bestCost) return;
    if (left === 0) { const rs = [...fixed, ...cur]; if (squadRating(rs).rating >= target) { bestCost = acc; best = { ...cnt }; } return; }
    if (li >= levels.length) return;
    const r = levels[li], max = Math.min(left, byR[r].length);
    // upper bound check: fill rest with this level (highest remaining)
    const ub = [...fixed, ...cur, ...Array(left).fill(r)]; if (squadRating(ub).rating < target) return;
    for (let n = max; n >= 0; n--) {
      cnt[r] = n; for (let i = 0; i < n; i++) cur.push(r);
      rec(li + 1, left - n, cur, acc + pre[r][n]);
      for (let i = 0; i < n; i++) cur.pop();
    }
    delete cnt[r];
  };
  rec(0, open, [], 0);
  if (!best) return null;
  const out = []; for (const [r, n] of Object.entries(best)) out.push(...byR[r].slice(0, n));
  return out;
}

function insights(ms) {
  const out = [];
  const bc = {}; let tot = 0; ms.forEach(m => (m.conceded || []).forEach(b => { bc[b] = (bc[b] || 0) + 1; tot++; }));
  if (tot >= 5) { const [b, n] = Object.entries(bc).sort((a, b) => b[1] - a[1])[0]; if (n / tot >= .25) out.push(`Du släpper in flest mål i minut <b>${b}</b> (${Math.round(n / tot * 100)}% av alla). Byt in fräscha spelare eller spela säkrare där.`); }
  const sorted = [...ms].sort((a, b) => a.t - b.t); let afterL = 0, afterLW = 0;
  for (let i = 1; i < sorted.length; i++) if (sorted[i - 1].res === 'L' && sorted[i].t - sorted[i - 1].t < 3 * 3600e3) { afterL++; if (sorted[i].res === 'W') afterLW++; }
  if (afterL >= 4) { const p = Math.round(afterLW / afterL * 100), all = Math.round(wld(ms).W / ms.length * 100); if (p < all - 8) out.push(`Efter en förlust vinner du bara <b>${p}%</b> (annars ${all}%). Pausen efter förluster lönar sig.`); }
  const late = ms.filter(m => new Date(m.t).getHours() >= 23 || new Date(m.t).getHours() < 4);
  if (late.length >= 4) { const p = Math.round(wld(late).W / late.length * 100), all = Math.round(wld(ms).W / ms.length * 100); if (p < all - 8) out.push(`Sent på natten vinner du <b>${p}%</b> mot ${all}% annars.`); }
  const withShots = ms.filter(m => +m.shots && +m.shotsA); if (withShots.length >= 4) { const conv = withShots.reduce((a, m) => a + m.gf, 0) / withShots.reduce((a, m) => a + +m.shots, 0); out.push(`Du gör mål på <b>${Math.round(conv * 100)}%</b> av dina skott.`); }
  return out;
}

function downloadICS(title, date) {

  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//FUT//SV', 'BEGIN:VEVENT', 'UID:' + uid() + '@fut', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(date), 'DTEND:' + f(end), 'SUMMARY:FUT: ' + title.replace(/[,;]/g, ' '), 'BEGIN:VALARM', 'TRIGGER:-PT60M', 'ACTION:DISPLAY', 'DESCRIPTION:' + title.replace(/[,;]/g, ' '), 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fut-paminnelse.ics'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

  const ps = [...players()].sort((a, b) => b.ovr - a.ovr);
  let t = `Min FUT-klubb (FC 27, ${ps.length} spelare${S.club.synced ? ', hämtad ' + S.club.synced : ''}).\nFormat: betyg namn position [säljbar pris | otradbar] [LÅST]\n`;
  if (S.squad) t += `Lag: ${S.squad.formation}: ${S.squad.xi.map(([p, n]) => p + ' ' + n).join(', ')}\n`;
  t += ps.map(p => `${p.ovr} ${p.name} ${[p.pos, ...(p.alt || [])].join('/')} ${p.tradeable ? kfmt(p.price) : 'otradbar'}${isLocked(p) ? ' LÅST' : ''}`).join('\n');
  return t;
}
async function copyText(t, ok) { try { await navigator.clipboard.writeText(t); toast(ok); } catch { openSheet({ title: 'Kopiera', body: `<p class="help">Tryck länge i rutan → Markera alla → Kopiera.</p><textarea class="paste" style="min-height:300px" readonly>${esc(t)}</textarea>` }); } }
function exportData() {
  const data = JSON.stringify({ app: 'fut', version: VERSION, exported: new Date().toISOString(), ...S });
  const name = `fut-backup-${today()}.json`;
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file], title: 'FUT backup' }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup sparad');
}
$('#filein').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app === 'fut') { const { app, version, exported, ...rest } = j; confirmSheet('Läs in backup?', 'Det här ersätter allt du har i appen nu.', 'Läs in', () => { S = Object.assign(fresh(), rest); S.settings = Object.assign(fresh().settings, rest.settings || {}); ensureIds(S.club.players || []); save(); applyTheme(); renderTabbar(); render(); toast('Backup inläst'); }, false); }
    else if (j.players) { const r = parseFutgg(JSON.stringify(j)); S.club.players = r.players; S.club.name = j.club || S.club.name; S.club.synced = j.synced || ''; if (r.squad) S.squad = r.squad; save(); render(); toast(`${r.players.length} spelare inlästa`); }
    else toast('Filen känns inte igen');
  } catch { toast('Kunde inte läsa filen'); }
});

/* ---------- Global actions ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const x = a.dataset.act;
    const A = {
      newMatch: () => matchSheet(null, a.dataset.mode), newTrade: () => tradeSheet(), newPack: () => packSheet(), newBal: () => balSheet(), newGoal: () => goalSheet(null),
      importClub, sbc: sbcSheet, goals: goalsSheet, tax: taxSheet, editHome, editTabs, editRanks,
      copyClub: () => players().length ? copyText(clubText(), 'Klubben kopierad – klistra in hos Claude') : toast('Importera klubben först'),
      copyStats: () => copyText(statsText(), 'Statistiken kopierad'),
      startPause, endPause: () => { S.pauseUntil = 0; save(); render(); }, ignoreTilt: () => { tiltSkip = true; render(); },
      newRun: () => confirmSheet('Starta ny omgång?', 'Nuvarande Champs-omgång sparas under Tidigare omgångar.', 'Starta ny', () => { S.runs.push({ id: uid(), start: Date.now() }); save(); render(); }, false),
      export: exportData, import: () => $('#filein').click(),
      reset: () => confirmSheet('Radera allt?', 'All data i appen försvinner. Spara gärna en backup först.', 'Radera allt', () => { localStorage.removeItem(KEY); S = fresh(); save(); applyTheme(); renderTabbar(); render(); toast('Allt raderat'); })
    };
    A[x]?.(); return;
  }
  const g = e.target.closest('[data-go]'); if (g && !e.target.closest('[data-act]')) { if (g.dataset.sub) sub[g.dataset.go] = g.dataset.sub; go(g.dataset.go); return; }
  const pl = e.target.closest('[data-pl]'); if (pl && pl.dataset.pl) { playerSheet(pl.dataset.pl); return; }
  const f = e.target.closest('[data-f]'); if (f && f.classList.contains('chip')) { filt.f = f.dataset.f; $$('.chip[data-f]').forEach(c => c.classList.toggle('on', c === f)); fillPlayers(); return; }
  const m = e.target.closest('[data-m]'); if (m) { matchSheet(S.matches.find(x => x.id === m.dataset.m)); return; }
  const t = e.target.closest('[data-trade]'); if (t) { tradeSheet(S.trades.find(x => x.id === t.dataset.trade)); return; }
  const b = e.target.closest('[data-bal]'); if (b) { balSheet(S.balance.find(x => String(x.t) === b.dataset.bal)); return; }
  const pk = e.target.closest('[data-pack]'); if (pk) { packSheet(S.packs.find(x => x.id === pk.dataset.pack)); return; }
  const gd = e.target.closest('#p-home [data-gdone]'); if (gd) { const go_ = S.goals.find(x => x.id === gd.dataset.gdone); go_.done = !go_.done; gd.classList.toggle('on'); save(); setTimeout(render, 300); return; }
  const gl = e.target.closest('#p-home [data-goal]'); if (gl) { goalSheet(S.goals.find(x => x.id === gl.dataset.goal)); return; }
  const st = e.target.closest('[data-set]'); if (st) { const k = st.dataset.set; S.settings[k] = !S.settings[k]; st.classList.toggle('on', S.settings[k]); save(); return; }
  const sp = e.target.closest('[data-step]'); if (sp) { const [k, d] = sp.dataset.step.split(':'); const lim = { tilt: [2, 10], pauseMin: [5, 60], champsGames: [5, 40] }[k]; S.settings[k] = Math.max(lim[0], Math.min(lim[1], S.settings[k] + +d)); save(); render(); return; }
  const th = e.target.closest('[data-theme-seg] button'); if (th) { S.settings.theme = th.dataset.v; save(); applyTheme(); render(); return; }
});
let tiltSkip = false;
const _tilt = HW.tilt; HW.tilt = () => { if (tiltSkip && S.pauseUntil <= Date.now()) return ''; return _tilt(); };
function statsText() {
  const ms = [...S.matches].sort((a, b) => a.t - b.t);
  return `Mina FUT-matcher (${ms.length} st). Format: datum läge resultat orsak formation insläppta-minuter skott xG\n` + ms.map(m => `${new Date(m.t).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' })} ${MODES[m.mode]} ${m.gf}-${m.ga}${m.pens ? ' (straffar)' : ''} ${m.reason || ''} ${m.formation || ''} ${(m.conceded || []).join(',')} ${m.shots ? 'skott ' + m.shots + '/' + (m.shotsA || '?') : ''} ${m.xg ? 'xG ' + m.xg + '/' + (m.xgA || '?') : ''} ${m.note || ''}`.replace(/\s+/g, ' ').trim()).join('\n');
}

/* ---------- Start ---------- */
go('home');
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(r => { r.update(); document.addEventListener('visibilitychange', () => !document.hidden && r.update()); });
  let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || sheetStack.length) return; reloaded = true; location.reload(); });
}
</script>
